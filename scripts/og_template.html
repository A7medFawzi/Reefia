<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@500;700&family=Alexandria:wght@700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0c1a10}
  .og{position:relative;width:1200px;height:630px;font-family:'Plus Jakarta Sans',sans-serif;color:#fffef2}
  .photo{position:absolute;top:0;bottom:0;width:62%;background-size:cover;background-position:center}
  .ltr .photo{right:0} .rtl .photo{left:0}
  .shade{position:absolute;inset:0}
  .ltr .shade{background:linear-gradient(90deg,#0c1f12 0%,#0c1f12 38%,rgba(12,31,18,.86) 50%,rgba(12,31,18,.25) 72%,rgba(12,31,18,0) 100%)}
  .rtl .shade{background:linear-gradient(270deg,#0c1f12 0%,#0c1f12 38%,rgba(12,31,18,.86) 50%,rgba(12,31,18,.25) 72%,rgba(12,31,18,0) 100%)}
  .content{position:absolute;top:64px;bottom:58px;width:600px;display:flex;flex-direction:column}
  .ltr .content{left:72px} .rtl .content{right:72px;text-align:right;direction:rtl}
  .logo{height:46px;width:auto;align-self:flex-start}
  .eyebrow{margin-top:44px;color:#f4a061;font-weight:700;font-size:21px;letter-spacing:.16em;text-transform:uppercase}
  .rtl .eyebrow{letter-spacing:0;font-family:'Cairo';font-size:25px}
  h1{margin-top:16px;font-family:'Playfair Display',serif;font-weight:600;font-size:60px;line-height:1.08}
  .rtl h1{font-family:'Alexandria';font-weight:700;font-size:56px;line-height:1.3}
  .sub{margin-top:20px;font-size:25px;line-height:1.45;color:rgba(255,254,242,.86)}
  .rtl .sub{font-family:'Cairo';font-size:27px}
  .foot{margin-top:auto;display:flex;align-items:center;gap:16px;font-weight:700;font-size:22px}
  .rtl .foot{font-family:'Cairo'}
  .chip{background:#f47d2d;color:#14100a;border-radius:999px;padding:10px 22px}
  .dom{color:rgba(255,254,242,.9);direction:ltr}
  .bar{position:absolute;bottom:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#1e481c,#f47d2d)}
</style></head>
<body><div class="og" id="og"><div class="photo" id="photo"></div><div class="shade"></div>
<div class="content"><img class="logo" src="/reefiya-logo-white.png" alt="">
<div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div class="sub" id="sub"></div>
<div class="foot"><span class="chip" id="chip"></span><span class="dom">reefiya.com</span></div></div>
<div class="bar"></div></div>
<script>
  const q=new URLSearchParams(location.search);
  const og=document.getElementById('og');og.className='og '+(q.get('dir')||'ltr');
  document.getElementById('photo').style.backgroundImage=`url(${q.get('photo')})`;
  if(q.get('pos'))document.getElementById('photo').style.backgroundPosition=q.get('pos');
  for(const k of ['eyebrow','title','sub','chip'])document.getElementById(k).textContent=q.get(k)||'';
</script></body></html>
